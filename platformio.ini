; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Placa alvo: Tapejara TPJ-01 v1.0 — ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB PSRAM octal).
; O board esp32-s3-devkitc-1 e' o generico N8; os overrides abaixo ajustam para o N16R8.
; PSRAM fica desabilitada de proposito (nao ha uso hoje; a camera OV2640 esta fora de escopo).
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = default, log2file
board_build.f_cpu = 240000000L

; Flash de 16 MB: particao maior para a app e para o LittleFS de /telem.bin.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; O framework Arduino injeta -Os e -std=gnu++11 DEPOIS das flags do projeto, e o
; GCC obedece a ultima ocorrencia — sem estes unflags o -O3/-std=gnu++17 abaixo
; eram silenciosamente ignorados. -fstack-protector poe canary em toda funcao com
; array local (todos os kernels de matriz) e nao serve de nada aqui.
build_unflags =
	-Os
	-std=gnu++11
	-fstack-protector

build_flags =
    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_VECTORIZE
    -DEIGEN_DISABLE_UNALIGNED_ARRAY_ASSERT
    -std=gnu++17
	-O3
	-ffast-math
	-funroll-loops
	; include/board_config.h precisa ser visivel tambem para as libs de lib/,
	; que o LDF compila como alvos separados.
	-I include
	; Serial -> USB nativo (IO19/20). SEM isso o Serial sai pelo U0TXD = IO43,
	; que na TPJ-01 e' o LED3 — nao ha conversor USB-UART na placa.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	hideakitai/ArduinoEigen @ ^0.2.2
	arduino-libraries/Madgwick@^1.2.0
	adafruit/Adafruit MPU6050@^2.2.6